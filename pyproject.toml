[project]
name = "exon-bot"
version = "0.1.0"
description = "Exon, a Discord bot."
requires-python = ">=3.12"
dependencies = [
    "discord.py>=2.7.1",
]

[project.scripts]
exon-bot = "exon_bot.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/exon_bot"]
